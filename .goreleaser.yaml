version: 2

project_name: bifrost-quota-monitor

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: bifrost-quota-monitor
    binaries:
      - bifrost-quota-monitor
    repository:
      owner: tedwardd
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/tedwardd/bifrost-usage-monitor
    description: tmux status bar segment showing Bifrost virtual key budget usage
    url:
      verified: github.com/tedwardd/bifrost-usage-monitor/
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/bifrost-quota-monitor"]
            # An upgrade swaps the binary but leaves the running agent on the old
            # one, since nothing here manages launchd. Restart it when init has
            # already installed the agent, and stay quiet when it has not.
            label = "com.github.tedwardd.bifrost-quota-monitor"
            if File.exist?(File.expand_path("~/Library/LaunchAgents/#{label}.plist"))
              system_command "/bin/launchctl",
                             args: ["kickstart", "-k", "gui/#{Process.uid}/#{label}"],
                             must_succeed: false
            end
          end
    # One line on purpose. goreleaser renders a multi-line caveat as a `caveats do`
    # block of bare string literals, and Ruby evaluates that to only the last one,
    # so every earlier line is silently dropped from what the user sees.
    caveats: "Set BIFROST_BASE_URL and BIFROST_API_KEY, then run 'bifrost-quota-monitor init' to install the launchd agent and patch your tmux config. There is no default gateway address, since Bifrost is self-hosted. See https://github.com/tedwardd/bifrost-usage-monitor for setup and troubleshooting."

checksum:
  name_template: checksums.txt

release:
  github:
    owner: tedwardd
    name: bifrost-usage-monitor
